# Table spec sections 1.0: one typed table per section of the ClinVar-GKM 1.1.0 bundle, every record property in
# its own column. This is the default spec (a build with no --spec writes these tables). Format:
# src/clinvar_gkm_parquet/spec.py. Rules: .claude/rules/table-spec.md.
#
# status: draft. ClinVar-GKM defines the columns: they are the superset of the properties, and of the value
# shapes, that the ClinVar-GKM producer emits for each section under bundle schema_version 1.1.0 (procedures,
# export and assembler, bounded by the bundle schema and its profiles), checked against real records. The set is
# fixed per schema_version: a property or value kind ClinVar-GKM adds comes with a schema bump, announced, and a
# new spec version here. There is no `data` column; a record that holds a property, a field or a value kind
# this spec lacks stops the build (no row or value is dropped).
#
# Checked 2026-10-29 against real records: every record of tests/fixtures/real-1.1.0/clinvar-gkm_excerpt.json.gz
# (2026-10-18 full, 331 records) and of the 2026-09-23 weekly delta (4,530,457 records) fits these types (every
# property and field known, every JSON kind as declared, every extension value in a slot, every pointer where
# declared, $.id equal to the key). The delta holds 15 sections; sequenceReference, therapy, therapyGroup,
# propositionOncogenicity and propositionSomaticClinicalImpact are checked on the excerpt only.
#
# Tables: one per bundle section, in the bundle schema's section order; table name = section name; sort key `id`.
#
# Columns:
# - `id` first: the bundle key. Where the record has its own `id` property it equals the key (it gets no column of
#   its own); sequenceReference, therapy and therapyGroup records have none.
# - Then one column per top-level property, named exactly as the property, in the producer's order: the field
#   order of the BigQuery STRUCT (or SELECT list) in the ClinVar-GKM procedure that builds the record. For the
#   sections the procedures build as BigQuery JSON (sequenceReference, location, allele, copyNumber*, gene,
#   therapy, therapyGroup, submitter, the proposition sections) the bundle line holds the keys sorted
#   alphabetically (BigQuery's JSON type sorts object keys); the spec keeps the STRUCT order. The other sections
#   (variation, condition, conditionSet, evidenceLine, scv, vcv, rcv) carry the STRUCT order on the bundle line,
#   except values the export passes through TO_JSON (variation constraints and extensions, scv and evidenceLine
#   extensions), which are key-sorted there too.
# - Union rule: when several producer branches (or classes) write one position, the columns, or the struct
#   fields, are the fields of the first in producer order, then each further one's new fields in its order.
#   Top level: evidenceLine = SCV evidence line, then VCV/RCV evidence line (the assembler's file order); the
#   proposition sections = SCV proposition, then SCV target proposition (propositionSomaticClinicalImpact only),
#   then the VCV/RCV propositions (the export's UNION order; they add no property). Nested: allele.state
#   (LiteralSequenceExpression, ReferenceLengthExpression, LengthExpression: one producer STRUCT), variation
#   constraints (the four Cat-VRS constraints: one producer STRUCT), variation extension items (HgvsListItem,
#   then GeneListItem), submitted condition values (submittedConditionSet, then submittedCondition).
# - Struct fields follow the same producer order. A struct holds every field the producer can emit there.
# - A property the producer could write but the section's schema class forbids is left out: the SCV proposition
#   query attaches modeOfInheritanceQualifier and penetranceQualifier to any SCV proposition, but only
#   VariantPathogenicityProposition and the Clinvar* custom propositions allow them, so propositionOncogenicity
#   and propositionSomaticClinicalImpact have no such columns (penetrance needs a germline classification; a
#   somatic record with a mode of inheritance would break the bundle schema, and stops the build).
# - Field names DuckDB's DESCRIBE prints quoted are quoted ("name", "type", "value", "system", "extensions",
#   "source", "location", "mapping", "ref", "sequence", "start", "end", "object", "constraints").
#
# Value rules:
# - Scalars: scalar-path, no casts: text (dates too) VARCHAR, integers BIGINT, booleans BOOLEAN.
# - Pointers ('#/<section>/<id>'): a top-level pointer or list of pointers is a bare-id column (VARCHAR /
#   VARCHAR[]) named as the property; a pointer inside a typed copy is listed in `pointers` (positions relative
#   to the column value) and holds the bare id. The description names the target section(s); a pointer to any
#   other section, or a non-pointer there, stops the build.
# - Objects and arrays: typed-copy with the full nested type.
# - Extensions: every `extensions` list, at any depth, is a list of STRUCT("name" VARCHAR, value_<kind> ...), one
#   slot per JSON kind the producer can put in `value` at that position, in the order value_string,
#   value_boolean, value_integer, value_number, value_object, then the arrays value_string_array, ...,
#   value_object_array (value_<element kind>_array). Each element sets the one slot of its value's kind; the
#   others are NULL. A value of another kind stops the build. A top-level `extensions` column is extension-slot;
#   `extension_slots` names every column whose type holds an extension struct (top-level or nested), with
#   `json-type`: the slot is chosen by the value's JSON kind, not by the extension name.
# - Int-or-Range: location.start and location.end are an integer or a VRS Range [min|null, max|null]. Each gives
#   three BIGINT columns: loc_start (range-exact: the integer, NULL for a Range), loc_start_min and loc_start_max
#   (range-min / range-max: the integer, or the Range's bound; NULL for an open bound), and the same for loc_end.
#   No other int-or-Range position is emitted as a Range: copyNumberCount.copies, allele.state.length and
#   variation constraints[].copies come from BigQuery INT64 columns (schemas/vrs_output_2_0_1.schema.json, the
#   gkm_vrs load schema), so they are BIGINT.
# - nulls: when-absent for every property column (top-level lists too: NULL when the record omits the
#   property; the producer never writes an empty list or object, gkm_json_cleanup.strip_empty drops them).
#   Inside a typed value an absent field is NULL.
name: sections
spec_version: "1.0"
status: draft
bundle_schema_versions: ["1.1.0"]
sources:
  - "ClinVar-GKM schema/clinvar-gkm/clinvar-gkm-bundle.schema.json @ origin/1.0 c8d9c0001fd765a0c1b82ea8067e29644a580a52 (the 20 sections, their order and classes)"
  - "ClinVar-GKM schema/clinvar-gkm/json/* (ClinvarCategoricalVariant, ClinvarGeneContextQualifier, ClinvarGermlineCustomProposition, ClinvarScvStatement, ClinvarAggregateStatement, ClinvarSomaticEvidenceLine, HgvsListItem, GeneListItem, SubmittedConditionMapping) @ origin/1.0 c8d9c0001fd765a0c1b82ea8067e29644a580a52"
  - "ClinVar-GKM src/procedures/gkm-{catvar,scv-condition,scv-statement,vcv-statement,rcv-statement}-proc.sql, gkm-proposition-section-func.sql @ origin/1.0 c8d9c0001fd765a0c1b82ea8067e29644a580a52 (record properties, STRUCT order, value types, extension names)"
  - "ClinVar-GKM schemas/vrs_output_2_0_1.schema.json @ origin/1.0 c8d9c0001fd765a0c1b82ea8067e29644a580a52 (gkm_vrs load schema: the VRS fields and their INT64 types)"
  - "ClinVar-GKM src/scripts/export-gkm-dicts.sh, assemble-gkm-dicts.py, gkm_json_cleanup.py @ origin/1.0 c8d9c0001fd765a0c1b82ea8067e29644a580a52 (section assembly, strip_empty, collapse_ext_values)"
  - "GA4GH va-spec 1.1.0 @ d9da20ca3c1a8fd20044bf45cc921ea38198b05f, schema/{va-spec,gkm-core,vrs,cat-vrs}/json (va-spec 1.1.0, gkm-core 1.3.0, vrs 2.1.1, cat-vrs 1.1.1: the classes the profiles $ref)"
  - "clinvar-gk-python @ e7bbbe5be2e3f1ca76c5adf8b4dbba0ba527873b (VRS Allele / CopyNumberCount / CopyNumberChange objects behind gkm_vrs)"
  - "This repo spec/1.0/tables.yaml @ 4d6d2d3b52126bcae64f039d75f2b02dd071709d (nested types taken from the procs and checked against the published BigQuery export's Parquet footers)"
  - "Real records: tests/fixtures/real-1.1.0/clinvar-gkm_excerpt.json.gz (2026-10-18 full, 331 records) and v1/1.1/deltas/2026-09/clinvar-gkm-delta_2026-0923.json.gz (sha256 3ed857f160da9ed39cd12d620c0d97f2d4e14612e96b0eb4d2545c3c37a59155, 4,530,457 records)"
writer:
  compression: snappy
  row_group_size: 122880
tables:
  - name: sequenceReference
    sections: [sequenceReference]
    row_filter: null
    sort_key: id
    known_fields: true
    description: VRS SequenceReference records, keyed by refget accession.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: The bundle key, SQ.<digest> (the record has no id; refgetAccession equals the key).
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always SequenceReference.
      - name: refgetAccession
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.refgetAccession, transform: null}
        description: The refget accession, SQ.<digest>.
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: The RefSeq accession, e.g. NC_000017.11.
      - name: moleculeType
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.moleculeType, transform: null}
        description: genomic, mRNA, RNA or protein.
      - name: residueAlphabet
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.residueAlphabet, transform: null}
        description: na or aa.
      - name: extensions
        type: 'STRUCT("name" VARCHAR, value_string VARCHAR)[]'
        nulls: when-absent
        derivation: {kind: extension-slot, path: $.extensions, transform: "{name, value} -> {name, value_<kind>}: value goes to the slot of its JSON kind, at every depth"}
        description: "Extension assembly (value_string: GRCh37, GRCh38 or NCBI36)."
    extension_slots:
      extensions: json-type

  - name: location
    sections: [location]
    row_filter: null
    sort_key: id
    known_fields: true
    description: VRS SequenceLocation records, a span on a reference sequence.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, ga4gh:SL.<digest>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always SequenceLocation.
      - name: digest
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.digest, transform: null}
        description: The digest part of the id.
      - name: loc_start
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-exact, path: $.start, transform: "the integer start; NULL when start is a Range ([min, max] list)"}
        description: Start (interbase) when it is an integer; NULL when it is a Range.
      - name: loc_start_min
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-min, path: $.start, transform: "COALESCE(integer start, start[0])"}
        description: "Lower bound of the start: the integer start, or the Range's first bound (NULL when open)."
      - name: loc_start_max
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-max, path: $.start, transform: "COALESCE(integer start, start[1])"}
        description: "Upper bound of the start: the integer start, or the Range's second bound (NULL when open)."
      - name: loc_end
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-exact, path: $.end, transform: "the integer end; NULL when end is a Range ([min, max] list)"}
        description: End (interbase) when it is an integer; NULL when it is a Range.
      - name: loc_end_min
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-min, path: $.end, transform: "COALESCE(integer end, end[0])"}
        description: "Lower bound of the end: the integer end, or the Range's first bound (NULL when open)."
      - name: loc_end_max
        type: BIGINT
        nulls: when-absent
        derivation: {kind: range-max, path: $.end, transform: "COALESCE(integer end, end[1])"}
        description: "Upper bound of the end: the integer end, or the Range's second bound (NULL when open)."
      - name: sequenceReference
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: bare-id, path: $.sequenceReference, transform: "strip ^#/[^/]+/"}
        description: The reference sequence, SQ.<digest> (section sequenceReference).

  - name: allele
    sections: [allele]
    row_filter: null
    sort_key: id
    known_fields: true
    description: VRS Allele records, a sequence change at a location.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, ga4gh:VA.<digest>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always Allele.
      - name: digest
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.digest, transform: null}
        description: The digest part of the id.
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: An expression for the allele (HGVS preferred).
      - name: state
        type: 'STRUCT("type" VARCHAR, "sequence" VARCHAR, length BIGINT, repeatSubunitLength BIGINT)'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.state, transform: null}
        description: "The state: LiteralSequenceExpression {type, sequence}, ReferenceLengthExpression {type, length, sequence, repeatSubunitLength} or LengthExpression {type, length}, one union struct."
      - name: expressions
        type: 'STRUCT(syntax VARCHAR, "value" VARCHAR)[]'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.expressions, transform: null}
        description: Expressions for the allele (spdi, hgvs.*, gnomad).
      - name: location
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: bare-id, path: $.location, transform: "strip ^#/[^/]+/"}
        description: "The location, ga4gh:SL.<digest> (section location)."

  - name: copyNumberCount
    sections: [copyNumberCount]
    row_filter: null
    sort_key: id
    known_fields: true
    description: VRS CopyNumberCount records, an absolute copy count over a region.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, ga4gh:CN.<digest>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always CopyNumberCount.
      - name: digest
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.digest, transform: null}
        description: The digest part of the id.
      - name: copies
        type: BIGINT
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.copies, transform: null}
        description: The absolute copy number (always an integer; the producer emits no Range).
      - name: location
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: bare-id, path: $.location, transform: "strip ^#/[^/]+/"}
        description: "The location, ga4gh:SL.<digest> (section location)."

  - name: copyNumberChange
    sections: [copyNumberChange]
    row_filter: null
    sort_key: id
    known_fields: true
    description: VRS CopyNumberChange records, a relative copy gain or loss over a region.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, ga4gh:CX.<digest>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always CopyNumberChange.
      - name: digest
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.digest, transform: null}
        description: The digest part of the id.
      - name: copyChange
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.copyChange, transform: null}
        description: gain or loss (EFO code).
      - name: location
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: bare-id, path: $.location, transform: "strip ^#/[^/]+/"}
        description: "The location, ga4gh:SL.<digest> (section location)."

  - name: gene
    sections: [gene]
    row_filter: null
    sort_key: id
    known_fields: true
    description: Genes (MappableConcept), keyed by NCBI Gene id.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, ncbigene:<n>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always MappableConcept.
      - name: conceptType
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.conceptType, transform: null}
        description: Always gene.
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: The gene symbol.
      - name: primaryCoding
        type: 'STRUCT(code VARCHAR, "name" VARCHAR, "system" VARCHAR, iris VARCHAR[])'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.primaryCoding, transform: null}
        description: The NCBI Gene coding.
      - name: mappings
        type: 'STRUCT(coding STRUCT(code VARCHAR, "system" VARCHAR, iris VARCHAR[]), relation VARCHAR)[]'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.mappings, transform: null}
        description: The HGNC coding, when there is one.

  - name: variation
    sections: [variation]
    row_filter: null
    sort_key: id
    known_fields: true
    description: ClinVar variants as Cat-VRS CategoricalVariant records, one per ClinVar Variation id.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, clinvar:<variation id>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always CategoricalVariant.
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: ClinVar's preferred name.
      - name: constraints
        type: 'STRUCT("type" VARCHAR, allele VARCHAR, "location" VARCHAR, copies BIGINT, copyChange VARCHAR, matchCharacteristic STRUCT("type" VARCHAR, primaryCoding STRUCT(code VARCHAR, "system" VARCHAR, iris VARCHAR[])), relations STRUCT("type" VARCHAR, primaryCoding STRUCT(code VARCHAR, "system" VARCHAR, iris VARCHAR[]))[])[]'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.constraints, transform: "allele and location pointers stripped", pointers: ["[*].allele", "[*].location"]}
        description: Cat-VRS constraints (DefiningAllele, DefiningLocation, CopyCount, CopyChange), one union struct; allele and location hold bare ids (sections allele, location).
      - name: members
        type: VARCHAR[]
        nulls: when-absent
        derivation: {kind: bare-id, path: $.members, transform: "strip ^#/[^/]+/ from each pointer, in order"}
        description: The member VRS variation, a bare id in section allele, copyNumberCount or copyNumberChange.
      - name: extensions
        type: 'STRUCT("name" VARCHAR, value_string VARCHAR, value_object_array STRUCT(nucleotideExpression STRUCT(syntax VARCHAR, "value" VARCHAR, "extensions" STRUCT("name" VARCHAR, value_string VARCHAR, value_boolean BOOLEAN)[]), nucleotideType VARCHAR, maneSelect BOOLEAN, manePlus BOOLEAN, proteinExpression STRUCT(syntax VARCHAR, "value" VARCHAR), molecularConsequence STRUCT(code VARCHAR, "system" VARCHAR, "name" VARCHAR, iris VARCHAR[])[], gene VARCHAR, relationship_type VARCHAR, "source" VARCHAR)[])[]'
        nulls: when-absent
        derivation: {kind: extension-slot, path: $.extensions, transform: "{name, value} -> {name, value_<kind>}: value goes to the slot of its JSON kind, at every depth", pointers: ["[*].value_object_array[*].gene"]}
        description: "Named ClinVar attributes: string values in value_string; clinvarHgvsList (HgvsListItem) and clinvarGeneList (GeneListItem, gene = bare id in section gene) items in value_object_array."
      - name: mappings
        type: 'STRUCT(coding STRUCT("system" VARCHAR, code VARCHAR, iris VARCHAR[]), relation VARCHAR)[]'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.mappings, transform: null}
        description: Identifiers for this variant in other systems (ClinVar, ClinGen, dbSNP, ...).
    extension_slots:
      extensions: json-type

  - name: condition
    sections: [condition]
    row_filter: null
    sort_key: id
    known_fields: true
    description: ClinVar conditions (traits) as MappableConcept records, one per ClinVar trait.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, clinvar.trait:<n>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always MappableConcept.
      - name: conceptType
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.conceptType, transform: null}
        description: Disease, Phenotype, Trait or Condition.
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: Preferred name.
      - name: aliases
        type: VARCHAR[]
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.aliases, transform: null}
        description: Alternate names.
      - name: primaryCoding
        type: 'STRUCT("name" VARCHAR, code VARCHAR, "system" VARCHAR, iris VARCHAR[])'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.primaryCoding, transform: null}
        description: The MedGen coding; code is the MedGen CUI.
      - name: mappings
        type: 'STRUCT(coding STRUCT("name" VARCHAR, code VARCHAR, "system" VARCHAR, iris VARCHAR[]), relation VARCHAR)[]'
        nulls: when-absent
        derivation: {kind: typed-copy, path: $.mappings, transform: null}
        description: Cross-references (MONDO, Orphanet, OMIM, HPO, ...).

  - name: conditionSet
    sections: [conditionSet]
    row_filter: null
    sort_key: id
    known_fields: true
    description: Sets of conditions (ClinVar TraitSets and minted VCV sets).
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, clinvar.traitset:<n> or clinvar.conditionset:vcv-<md5>; equals $.id."
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always ConceptSet.
      - name: conceptSetType
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.conceptSetType, transform: null}
        description: ClinVar's TraitSet type; absent on minted sets.
      - name: concepts
        type: VARCHAR[]
        nulls: when-absent
        derivation: {kind: bare-id, path: $.concepts, transform: "strip ^#/[^/]+/ from each pointer, in order"}
        description: "Members, bare ids in section condition (clinvar.trait:) or conditionSet (clinvar.traitset:)."
      - name: membershipOperator
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.membershipOperator, transform: null}
        description: AND or OR.

  - name: therapy
    sections: [therapy]
    row_filter: null
    sort_key: id
    known_fields: true
    description: Drug therapies (MappableConcept), content-addressed.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, clinvar.therapy:<sha256> (the record has no id)."
      - name: name
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.name, transform: null}
        description: The therapy name.
      - name: type
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.type, transform: null}
        description: Always MappableConcept.
      - name: conceptType
        type: VARCHAR
        nulls: when-absent
        derivation: {kind: scalar-path, path: $.conceptType, transform: null}
        description: Always Drug.

  - name: therapyGroup
    sections: [therapyGroup]
    row_filter: null
    sort_key: id
    known_fields: true
    description: Combination therapies (TherapyGroup), content-addressed.
    columns:
      - name: id
        type: VARCHAR
        nulls: never
        derivation: {kind: key, path: null, transform: null}
        description: "The bundle key, clinvar.therapygroup:<sha256> (the record has no id)."
      - name: type
        type: VARCHAR
        nulls: when-absent
