# Table spec sections 1.0: one table per section of the 1.1.0 bundle, each record property its own typed
# column, no `data` column (ADR 0003). Format: src/clinvar_gkm_parquet/spec.py. Rules:
# .claude/rules/table-spec.md. Renderer: the generic renderer (sqltemplate.render_generic).
#
# PROVISIONAL: written by the engine work (feat/sections-engine) only to test the engine. Shapes come from
# the real 1.1.0 excerpt (tests/fixtures/real-1.1.0) merged with spec/1.0's nested types, its extension
# slots converted to slots by JSON type; pointer positions from the excerpt. It does not hold the full 1.1.0
# column set; the reviewed file replaces it.
#
# Rules for every table: column `id` is the bundle key (the record's own `id`, when present, must equal it);
# every other top-level property is one column named as the property; known_fields stops the build on a
# property no column reads; an extension {name, value} fills the one value_<kind> slot of its value's JSON
# type (extension_slots: json-type); a #/<section>/<id> pointer becomes the bare id.
name: sections
spec_version: "1.0"
status: draft
bundle_schema_versions: ["1.1.0"]
sources:
  - "clinvar-gkm 2026-10-18 weekly full excerpt (tests/fixtures/real-1.1.0), record shapes"
  - "spec/1.0/tables.yaml (clinvar-gkm 1.0) nested types"
