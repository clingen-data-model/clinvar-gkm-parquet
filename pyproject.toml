[project]
name = "clinvar-gkm-parquet"
version = "1.0.1"
description = "Rebuild ClinVar-GKM's Parquet tables from its published JSON bundles"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ClinGen Data Model WG" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# duckdb is pinned exactly: the output bytes depend on it (design plan §9.3, D8). 1.5.4 is the version that
# merges ClinVar-GKM's published Parquet today. PyYAML reads the table spec (spec/<version>/tables.yaml).
# jsonschema-rs is `validate`'s default engine, pinned exactly: its verdicts are proved equal to the reference
# validator's at this version (docs/validate.md).
dependencies = [
    "duckdb==1.5.4",
    "PyYAML>=6.0",
    "jsonschema-rs==0.61.1",
]

[project.optional-dependencies]
# `validate --engine python`: the GA4GH GKM Toolkit's validator, the reference the rs engine is checked against.
# Its GA4GH dependencies are pre-releases, so install it with a pre-release resolver
# (`uv sync --extra reference`, or `pip install --pre 'clinvar-gkm-parquet[reference]'`).
reference = [
    "ga4gh.gkm==0.4.0; python_version >= '3.11'",
]

[project.urls]
Repository = "https://github.com/clingen-data-model/clinvar-gkm-parquet"

[project.scripts]
clinvar-gkm-parquet = "clinvar_gkm_parquet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ga4gh.gkm==0.4.0; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinvar_gkm_parquet"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "clinvar_gkm_parquet/_spec"
"schemas" = "clinvar_gkm_parquet/_schemas"

[tool.hatch.build.targets.sdist]
include = ["src", "spec", "schemas", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: reads from data.clinvar-gkm.org or w3id.org (opt-in: pytest -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.uv]
# ga4gh.gkm 0.4.0 (the reference extra) needs pre-releases of the GA4GH model packages.
prerelease = "allow"
