[project]
name = "clinvar-gkm-parquet"
version = "0.1.0.dev0"
description = "Rebuild ClinVar-GKM's Parquet tables from its published JSON bundles"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ClinGen Data Model WG" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# duckdb is pinned exactly: the output bytes depend on it (design plan §9.3, D8). 1.5.4 is the version that
# merges ClinVar-GKM's published Parquet today. PyYAML reads the table spec (spec/<version>/tables.yaml).
dependencies = [
    "duckdb==1.5.4",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/clingen-data-model/clinvar-gkm-parquet"

[project.scripts]
clinvar-gkm-parquet = "clinvar_gkm_parquet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinvar_gkm_parquet"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "clinvar_gkm_parquet/_spec"

[tool.hatch.build.targets.sdist]
include = ["src", "spec", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: reads from data.clinvar-gkm.org (opt-in: pytest -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
